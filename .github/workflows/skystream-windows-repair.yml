name: SkyStream Windows CS3 Repair (Experimental)

on:
  push:
    branches:
      - skystream-windows-repair-20261115
    paths:
      - ".github/workflows/skystream-windows-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Rebuild Java engine and package verified Windows installer
    runs-on: windows-2022
    timeout-minutes: 85

    steps:
      - name: Checkout isolated build scripts
        uses: actions/checkout@v4

      - name: Checkout official SkyStream v2.9.0 source
        uses: actions/checkout@v4
        with:
          repository: akashdh11/skystream
          ref: v2.9.0
          path: skystream-repair/skystream
          persist-credentials: false

      - name: Patch source with strict anchor checks
        shell: pwsh
        run: python skystream-repair/patch_engine.py

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android 36 platform is installed for framework shims
        shell: pwsh
        run: |
          $Platform = Join-Path $env:ANDROID_HOME 'platforms/android-36/android.jar'
          if (-not (Test-Path $Platform)) {
            $SdkManager = (Get-Command sdkmanager.bat -ErrorAction SilentlyContinue).Source
            if (-not $SdkManager) {
              $SdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
            }
            if (-not (Test-Path $SdkManager)) { throw "Android sdkmanager not found" }
            & $SdkManager --install 'platforms;android-36'
            if ($LASTEXITCODE -ne 0) { throw "android-36 platform installation failed" }
          }
          if (-not (Test-Path $Platform)) { throw "android.jar missing after setup" }

      - name: Build patched JVM engine jars
        shell: pwsh
        run: |
          Push-Location skystream-repair/skystream/packages/cs3_engine/engine
          try {
            & ./gradlew.bat --no-daemon --console=plain :engine-jvm:dist
            if ($LASTEXITCODE -ne 0) { throw "Gradle engine build failed" }
          } finally { Pop-Location }
          $dist = 'skystream-repair/skystream/packages/cs3_engine/engine/engine-jvm/build/dist/lib'
          if (-not (Test-Path $dist)) { throw "Missing engine build output" }
          $jars = @(Get-ChildItem "$dist/*.jar")
          if ($jars.Count -lt 5) { throw "Unexpectedly few Java engine jars: $($jars.Count)" }
          Write-Host "Patched Java engine: $($jars.Count) jars"

      - name: Download and verify OFFICIAL portable Windows v2.9.0 release
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'SkyStream-Official-v2.9.0.zip'
          $url = 'https://github.com/akashdh11/skystream/releases/download/v2.9.0/skystream-windows-x64-v2.9.0.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 10
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $expected = '99864dd0f75b403efde2e6f8e683ad0191717a23c82723685a22755585b26dbe'
          if ($hash -ne $expected) { throw "Official ZIP checksum mismatch: $hash" }
          Write-Host "Verified official ZIP: $hash"
          $release = Join-Path $env:RUNNER_TEMP 'SkyStream-Repaired'
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $release -Force
          if (-not (Test-Path (Join-Path $release 'skystream.exe'))) {
            throw "The official portable release has an unexpected directory layout"
          }

      - name: Replace only the CloudStream JVM engine and retain the upstream Flutter binary
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'SkyStream-Repaired'
          $engine = Join-Path $release 'data/flutter_assets/packages/cs3_engine/assets/engine'
          if (-not (Test-Path $engine)) { throw "Engine assets not found: $engine" }
          $jars = 'skystream-repair/skystream/packages/cs3_engine/engine/engine-jvm/build/dist/lib'
          Remove-Item -LiteralPath $engine -Recurse -Force
          New-Item -ItemType Directory -Path $engine | Out-Null
          Copy-Item "$jars/*.jar" -Destination $engine -Force
          Move-Item -LiteralPath (Join-Path $release 'skystream.exe') -Destination (Join-Path $release 'skystream-core.exe')
          Write-Host "Preserved the original Windows app; patched only engine dependencies"

      - name: Configure Go for the Windows launch shim
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Build no-console Windows GUI launcher with 6 GB JVM budget
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'SkyStream-Repaired/skystream.exe'
          & go build -trimpath -ldflags="-H windowsgui" -o $out skystream-repair/launcher/main.go
          if ($LASTEXITCODE -ne 0) { throw "Go launcher build failed" }
          if (-not (Test-Path $out)) { throw "Launcher exe missing" }

      - name: Install pinned Inno Setup 7.1.0 for a normal Windows setup exe
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 10
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($hash -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') {
            throw "Inno Setup checksum mismatch: $hash"
          }
          $p = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/ALLUSERS' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Inno installer returned $($p.ExitCode)" }

      - name: Create Windows installer
        shell: pwsh
        run: |
          $iscc = 'C:/Program Files/Inno Setup 7/ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Pinned Inno Setup compiler not found" }
          $release = Join-Path $env:RUNNER_TEMP 'SkyStream-Repaired'
          $iss = 'skystream-repair/skystream/windows/packaging/exe/setup.iss'
          & $iscc '/DAppVersion=2.9.0.1' '/DAppArch=x64' "/DAppDir=$release" $iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          $setup = 'skystream-repair/skystream/windows/packaging/exe/Output/SkyStream-Windows-x64-Setup-2.9.0.1.exe'
          if (-not (Test-Path $setup)) { throw "Expected installer is missing" }
          Get-FileHash -Algorithm SHA256 -LiteralPath $setup | Format-List

      - name: Preserve installer as downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyStream-Windows-2.9.0.1-CS3-Repair-TEST
          path: skystream-repair/skystream/windows/packaging/exe/Output/SkyStream-Windows-x64-Setup-2.9.0.1.exe
          retention-days: 30
          if-no-files-found: error

      - name: Publish public experimental installer asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: skystream-windows-cs3-repair-2.9.0.1-test
          name: "SkyStream Windows 2.9.0.1 — CS3 Repair TEST"
          prerelease: true
          draft: false
          body: |
            Experimental Windows CloudStream engine build for diagnosis, NOT a confirmed StreamPlay fix.
            Uses the authentic upstream v2.9.0 Windows client with the JVM engine rebuilt from
            SkyStream source using skystream-repair/patch_engine.py. JVM heap 6 GB for this process
            only, forced fresh conversion cache, reduced concurrent conversions and differentiated
            link-extraction errors. No bundled providers or pirated media.
            Source: https://github.com/akashdh11/skystream/tree/v2.9.0 and this branch's patch.
            Copyright and upstream GPL-3.0 licensing remain applicable.
          files: skystream-repair/skystream/windows/packaging/exe/Output/SkyStream-Windows-x64-Setup-2.9.0.1.exe
